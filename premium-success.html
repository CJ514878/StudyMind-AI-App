<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StudyMind AI — Premium</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #3a2a00 0%,
                    #15110a 35%,
                    #080808 75%
                );
            color: #ffffff;
        }

        .success-card {
            width: min(520px, 100%);
            padding: 42px 30px;
            text-align: center;
            border-radius: 24px;
            background: rgba(24, 24, 24, 0.94);
            border: 1px solid rgba(255, 193, 7, 0.35);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55);
        }

        .icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 42px;
            background: rgba(255, 193, 7, 0.12);
            border: 1px solid rgba(255, 193, 7, 0.35);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        p {
            margin: 0;
            color: #cfcfcf;
            line-height: 1.6;
        }

        #status {
            margin-top: 24px;
            min-height: 28px;
            font-weight: 600;
        }

        .loading {
            color: #ffd54f;
        }

        .success {
            color: #66e26f;
        }

        .error {
            color: #ff6b6b;
        }

        .button {
            display: none;
            margin-top: 28px;
            width: 100%;
            padding: 14px 20px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            color: #111;
            background: #ffc107;
        }

        .button:hover {
            background: #ffd54f;
        }
    </style>
</head>

<body>

    <main class="success-card">

        <div
            class="icon"
            id="statusIcon"
        >
            ⏳
        </div>

        <h1 id="title">
            Verifying your Premium payment...
        </h1>

        <p id="message">
            Please wait while StudyMind AI securely
            confirms your payment.
        </p>

        <div
            id="status"
            class="loading"
        >
            Verifying payment...
        </div>

        <button
            type="button"
            id="continueButton"
            class="button"
        >
            Continue to Premium 👑
        </button>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>
        "use strict";


        /* =====================================================
           ELEMENTS
           ===================================================== */

        const title =
            document.getElementById("title");

        const message =
            document.getElementById("message");

        const status =
            document.getElementById("status");

        const icon =
            document.getElementById("statusIcon");

        const continueButton =
            document.getElementById("continueButton");


        /* =====================================================
           GET URL PARAMETERS
           ===================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const provider =
            (
                params.get("provider") ||
                ""
            )
            .toLowerCase()
            .trim();


        /*
         * Paystack:
         * ?reference=XXXX
         *
         * Flutterwave:
         * ?transaction_id=XXXX
         * ?tx_ref=XXXX
         *
         * Stripe:
         * ?session_id=XXXX
         */

        const reference =
            params.get("reference") ||
            params.get("transaction_id") ||
            params.get("session_id") ||
            "";


        const transactionId =
            params.get("transaction_id") ||
            "";


        /* =====================================================
           AUTH
           ===================================================== */

        async function getAccessToken() {

            if (
                !window.supabaseClient
            ) {

                throw new Error(
                    "Supabase client is not available."
                );

            }


            const {
                data,
                error
            } =
                await window.supabaseClient
                    .auth
                    .getSession();


            if (error) {

                throw error;

            }


            const token =
                data?.session?.access_token;


            if (!token) {

                throw new Error(
                    "Your login session could not be found."
                );

            }


            return token;

        }


        /* =====================================================
           VERIFY PAYMENT
           ===================================================== */

        async function verifyPayment() {

            if (
                !provider
            ) {

                throw new Error(
                    "Payment provider was not specified."
                );

            }


            /*
             * Flutterwave needs transaction_id.
             */

            if (
                provider ===
                "flutterwave"
            ) {

                if (!transactionId) {

                    throw new Error(
                        "Flutterwave transaction ID was not provided."
                    );

                }

            }


            /*
             * Paystack needs reference.
             */

            if (
                provider ===
                "paystack"
            ) {

                if (
                    !params.get("reference")
                ) {

                    throw new Error(
                        "Paystack payment reference was not provided."
                    );

                }

            }


            /*
             * Stripe needs session_id.
             */

            if (
                provider ===
                "stripe"
            ) {

                if (
                    !params.get("session_id")
                ) {

                    throw new Error(
                        "Stripe checkout session was not provided."
                    );

                }

            }


            const token =
                await getAccessToken();


            const response =
                await fetch(
                    "/api/premium/verify",
                    {
                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${token}`

                        },

                        body:
                            JSON.stringify({

                                provider,

                                reference:
                                    provider ===
                                    "flutterwave"
                                        ? transactionId
                                        : reference,

                                transaction_id:
                                    transactionId,

                                session_id:
                                    params.get(
                                        "session_id"
                                    )

                            })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                data?.premium !== true
            ) {

                throw new Error(
                    data?.error ||
                    "Payment could not be verified."
                );

            }


            return data;

        }


        /* =====================================================
           SUCCESS
           ===================================================== */

        function showSuccess() {

            icon.textContent =
                "👑";

            title.textContent =
                "Premium Activated!";

            message.textContent =
                "Your StudyMind AI Premium access is now active.";

            status.textContent =
                "✓ Payment verified successfully.";

            status.className =
                "success";

            continueButton.style.display =
                "block";

        }


        /* =====================================================
           FAILURE
           ===================================================== */

        function showError(error) {

            console.error(
                "Premium verification failed:",
                error
            );

            icon.textContent =
                "⚠️";

            title.textContent =
                "We couldn't verify your payment";

            message.textContent =
                "Your payment may still be processing. Please don't pay again until you check your Premium status.";

            status.textContent =
                error?.message ||
                "Payment verification failed.";

            status.className =
                "error";

            continueButton.textContent =
                "Return to Premium";

            continueButton.style.display =
                "block";

        }


        /* =====================================================
           CONTINUE
           ===================================================== */

        continueButton.addEventListener(
            "click",
            () => {

                /*
                 * Premium has already been activated
                 * server-side. Now open the Premium app.
                 */

                window.location.href =
                    "premium-app.html";

            }
        );


        /* =====================================================
           START
           ===================================================== */

        async function start() {

            try {

                await verifyPayment();

                showSuccess();

            } catch (error) {

                showError(error);

            }

        }


        start();

    </script>

</body>
</html>
