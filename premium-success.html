
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StudyMind AI — Premium</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #3a2a00 0%,
                    #15110a 35%,
                    #080808 75%
                );
            color: #ffffff;
        }

        .success-card {
            width: min(520px, 100%);
            padding: 42px 30px;
            text-align: center;
            border-radius: 24px;
            background: rgba(24, 24, 24, 0.94);
            border: 1px solid rgba(255, 193, 7, 0.35);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55);
        }

        .icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 42px;
            background: rgba(255, 193, 7, 0.12);
            border: 1px solid rgba(255, 193, 7, 0.35);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        p {
            margin: 0;
            color: #cfcfcf;
            line-height: 1.6;
        }

        #status {
            margin-top: 24px;
            min-height: 28px;
            font-weight: 600;
            line-height: 1.5;
        }

        .loading {
            color: #ffd54f;
        }

        .success {
            color: #66e26f;
        }

        .pending {
            color: #ffd54f;
        }

        .error {
            color: #ff6b6b;
        }

        .button {
            display: none;
            margin-top: 28px;
            width: 100%;
            padding: 14px 20px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            color: #111;
            background: #ffc107;
            transition: background 0.2s ease;
        }

        .button:hover {
            background: #ffd54f;
        }

        .button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .small-note {
            margin-top: 18px;
            font-size: 13px;
            color: #999;
        }

        @media (max-width: 480px) {
            .success-card {
                padding: 34px 22px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <main class="success-card">

        <div
            class="icon"
            id="statusIcon"
        >
            ⏳
        </div>

        <h1 id="title">
            Verifying your Premium payment...
        </h1>

        <p id="message">
            Please wait while StudyMind AI securely
            confirms your payment.
        </p>

        <div
            id="status"
            class="loading"
            role="status"
            aria-live="polite"
        >
            Verifying payment...
        </div>

        <button
            type="button"
            id="continueButton"
            class="button"
        >
            Continue to Premium 👑
        </button>

        <p class="small-note">
            Your payment is checked securely by StudyMind AI.
        </p>

    </main>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>
        "use strict";


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const title =
            document.getElementById("title");

        const message =
            document.getElementById("message");

        const status =
            document.getElementById("status");

        const icon =
            document.getElementById("statusIcon");

        const continueButton =
            document.getElementById("continueButton");


        /* =====================================================
           URL PARAMETERS
        ===================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const transactionId =
            params.get("transaction_id") || "";

        const stripeSessionId =
            params.get("session_id") || "";

        const flutterwaveReference =
            params.get("tx_ref") || "";

        const paystackReference =
            params.get("reference") || "";


        /*
         * Identify the payment provider.
         */

        const provider =
            (
                params.get("provider") ||
                (
                    paystackReference
                        ? "paystack"
                        : transactionId || flutterwaveReference
                            ? "flutterwave"
                            : stripeSessionId
                                ? "stripe"
                                : ""
                )
            )
            .toLowerCase()
            .trim();


        /*
         * Select the appropriate payment reference.
         */

        const reference =
            provider === "paystack"
                ? paystackReference
                : provider === "flutterwave"
                    ? flutterwaveReference || transactionId
                    : provider === "stripe"
                        ? stripeSessionId
                        : "";


        /* =====================================================
           STATE
        ===================================================== */

        let verificationInProgress = false;

        let paymentVerified = false;

        let paymentPending = false;

        let retryCount = 0;

        const MAX_AUTOMATIC_RETRIES = 5;

        const RETRY_DELAY = 3000;


        /* =====================================================
           DISPLAY HELPERS
        ===================================================== */

        function showLoading(text) {

            icon.textContent = "⏳";

            title.textContent =
                "Verifying your Premium payment...";

            message.textContent =
                "Please wait while StudyMind AI securely confirms your payment.";

            status.textContent =
                text || "Verifying payment...";

            status.className = "loading";

            continueButton.style.display = "none";

        }


        function showSuccess() {

            paymentVerified = true;

            paymentPending = false;

            icon.textContent = "👑";

            title.textContent =
                "Premium Activated!";

            message.textContent =
                "Your StudyMind AI Premium access is now active.";

            status.textContent =
                "✓ Payment verified successfully.";

            status.className = "success";

            continueButton.textContent =
                "Continue to Premium 👑";

            continueButton.style.display =
                "block";

        }


        function showPending(messageText) {

            paymentPending = true;

            icon.textContent = "⏳";

            title.textContent =
                "Payment is being confirmed";

            message.textContent =
                "Your payment may have been received, but confirmation is not complete yet. You do not need to pay again.";

            status.textContent =
                messageText ||
                "Waiting for payment confirmation...";

            status.className = "pending";

            continueButton.textContent =
                "Check Payment Again";

            continueButton.style.display =
                "block";

        }


        function showError(error) {

            console.error(
                "Premium verification failed:",
                error
            );

            paymentPending = false;

            icon.textContent = "⚠️";

            title.textContent =
                "We couldn't verify your payment";

            message.textContent =
                "Your payment may still be processing. Please check your payment status before attempting another purchase.";

            status.textContent =
                error?.message ||
                "Payment verification could not be completed.";

            status.className = "error";

            continueButton.textContent =
                "Return to Premium";

            continueButton.style.display =
                "block";

        }


        /* =====================================================
           SUPABASE AUTHENTICATION
        ===================================================== */

        async function getAccessToken() {

            if (!window.supabaseClient) {

                throw new Error(
                    "Supabase client is not available. Please refresh the page."
                );

            }

            const {
                data,
                error
            } = await window.supabaseClient
                .auth
                .getSession();


            if (error) {

                throw error;

            }


            const token =
                data?.session?.access_token;


            if (!token) {

                throw new Error(
                    "Your login session could not be found. Please sign in again."
                );

            }


            return token;

        }


        /* =====================================================
           VALIDATE PAYMENT PARAMETERS
        ===================================================== */

        function validatePaymentParameters() {

            if (!provider) {

                throw new Error(
                    "Payment provider was not specified."
                );

            }


            if (
                ![
                    "paystack",
                    "flutterwave",
                    "stripe"
                ].includes(provider)
            ) {

                throw new Error(
                    "Unsupported payment provider."
                );

            }


            if (
                provider === "paystack" &&
                !paystackReference
            ) {

                throw new Error(
                    "Paystack payment reference was not provided."
                );

            }


            if (
                provider === "flutterwave" &&
                !transactionId
            ) {

                throw new Error(
                    "Flutterwave transaction ID was not provided."
                );

            }


            if (
                provider === "stripe" &&
                !stripeSessionId
            ) {

                throw new Error(
                    "Stripe checkout session was not provided."
                );

            }

        }


        /* =====================================================
           VERIFY PAYMENT WITH BACKEND
        ===================================================== */

        async function verifyPayment() {

            validatePaymentParameters();


            const token =
                await getAccessToken();


            /*
             * The backend performs the actual verification
             * with the payment provider.
             */

            const response =
                await fetch(
                    "/api/premium/verify",
                    {
                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${token}`

                        },

                        body: JSON.stringify({

                            provider: provider,

                            reference: reference,

                            transaction_id:
                                transactionId,

                            session_id:
                                stripeSessionId

                        })

                    }
                );


            let data;

            try {

                data = await response.json();

            } catch {

                throw new Error(
                    "The verification server returned an invalid response."
                );

            }


            /*
             * A 202 response means the payment is still
             * being processed. It is not a confirmed failure.
             */

            if (
                response.status === 202 ||
                data?.pending === true
            ) {

                return {
                    verified: false,
                    pending: true,
                    message:
                        data?.message ||
                        data?.error ||
                        "Your payment is still being confirmed."
                };

            }


            /*
             * Premium is only activated when the backend
             * confirms it.
             */

            if (
                response.ok &&
                data?.premium === true
            ) {

                return {
                    verified: true,
                    pending: false,
                    data: data
                };

            }


            throw new Error(
                data?.error ||
                data?.message ||
                "Payment could not be verified."
            );

        }


        /* =====================================================
           AUTOMATIC RETRY
        ===================================================== */

        function wait(milliseconds) {

            return new Promise(resolve => {

                setTimeout(resolve, milliseconds);

            });

        }


        async function verifyWithRetries() {

            for (
                let attempt = 0;
                attempt <= MAX_AUTOMATIC_RETRIES;
                attempt++
            ) {

                try {

                    showLoading(
                        attempt === 0
                            ? "Verifying payment..."
                            : "Checking payment confirmation..."
                    );


                    const result =
                        await verifyPayment();


                    if (result.verified) {

                        showSuccess();

                        return;

                    }


                    if (result.pending) {

                        showPending(
                            result.message
                        );


                        if (
                            attempt <
                            MAX_AUTOMATIC_RETRIES
                        ) {

                            retryCount = attempt + 1;

                            await wait(RETRY_DELAY);

                            continue;

                        }


                        return;

                    }

                } catch (error) {

                    /*
                     * Do not automatically retry authentication
                     * errors or invalid payment details.
                     */

                    showError(error);

                    return;

                }

            }

        }


        /* =====================================================
           MANUAL VERIFICATION
        ===================================================== */

        async function checkPaymentAgain() {

            if (verificationInProgress) {

                return;

            }


            verificationInProgress = true;

            continueButton.disabled = true;


            try {

                showLoading(
                    "Checking your payment again..."
                );


                const result =
                    await verifyPayment();


                if (result.verified) {

                    showSuccess();

                } else if (result.pending) {

                    showPending(
                        result.message
                    );

                }

            } catch (error) {

                showError(error);

            } finally {

                verificationInProgress = false;

                continueButton.disabled = false;

            }

        }


        /* =====================================================
           CONTINUE BUTTON
        ===================================================== */

        continueButton.addEventListener(
            "click",
            async () => {

                /*
                 * Only verified payments can enter the
                 * Premium application from this page.
                 */

                if (paymentVerified) {

                    window.location.href =
                        "premium-app.html";

                    return;

                }


                /*
                 * Pending payments can be checked again.
                 */

                if (paymentPending) {

                    await checkPaymentAgain();

                    return;

                }


                /*
                 * Unverified payments return to the
                 * Premium information page.
                 */

                window.location.href =
                    "premium.html";

            }
        );


        /* =====================================================
           START
        ===================================================== */

        async function start() {

            if (verificationInProgress) {

                return;

            }


            verificationInProgress = true;

            try {

                await verifyWithRetries();

            } finally {

                verificationInProgress = false;

            }

        }


        start();

    </script>

</body>
</html>
