
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Payment | StudyMind AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f5df91;
            --background: #f8f6ef;
            --card: #ffffff;
            --text: #29271f;
            --muted: #77736a;
            --border: #e9e2cf;
            --success: #16834a;
            --error: #c0392b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        body.dark {
            --background: #171717;
            --card: #242424;
            --text: #f7f3e8;
            --muted: #b5ad9c;
            --border: #444033;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 38px 28px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,.08);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .logo span {
            color: var(--gold);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(212,175,55,.13);
            color: var(--gold);
            font-size: 35px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 25px;
        }

        p {
            color: var(--muted);
            line-height: 1.65;
            font-size: 14px;
        }

        .status {
            margin-top: 22px;
            padding: 14px;
            border-radius: 12px;
            background: rgba(212,175,55,.10);
            color: var(--text);
            font-size: 13px;
            line-height: 1.6;
        }

        .status.success {
            background: rgba(22,131,74,.10);
            color: var(--success);
        }

        .status.error {
            background: rgba(192,57,43,.10);
            color: var(--error);
        }

        .spinner {
            width: 34px;
            height: 34px;
            margin: 20px auto;
            border: 4px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 11px;
            background: var(--gold);
            color: #171717;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--gold-light);
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .hidden {
            display: none;
        }

        .small {
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            StudyMind <span>AI</span>
        </div>

        <div class="icon" id="mainIcon">✦</div>

        <h1 id="pageTitle">Verifying your payment</h1>

        <p id="description">
            Please wait while we securely verify your payment.
            Do not close this page.
        </p>

        <div class="spinner" id="spinner"></div>

        <div class="status" id="statusMessage">
            Connecting to StudyMind AI...
        </div>

        <button
            id="dashboardButton"
            class="hidden"
            onclick="goToDashboard()"
        >
            Go to Dashboard
        </button>

        <button
            id="retryButton"
            class="hidden secondary"
            onclick="startVerification()"
        >
            Retry Verification
        </button>

        <p class="small">
            StudyMind AI Premium · Secure Payment Verification
        </p>

    </main>


    <script>
    "use strict";

    /* =========================================
       CONFIGURATION
    ========================================= */

    const CONFIG = {
        SUPABASE_URL:
            "https://bicnrbqqvucgpbwudmit.supabase.co",

        SUPABASE_PUBLISHABLE_KEY:
            "sb_publishable_70y0MPrj30-FimUSQK_HuA_Ng1a1qcB",

        VERIFY_ENDPOINT:
            "/api/premium/verify",

        STATUS_ENDPOINT:
            "/api/premium/status",

        DASHBOARD_URL:
            "dashboard.html"
    };


    /* =========================================
       SUPABASE CLIENT
    ========================================= */

    let supabaseClient = null;

    function initializeSupabase() {

        if (window.supabaseClient) {
            supabaseClient = window.supabaseClient;
            return supabaseClient;
        }

        if (window.studyMindSupabase) {
            supabaseClient = window.studyMindSupabase;
            return supabaseClient;
        }

        if (
            !window.supabase ||
            !window.supabase.createClient
        ) {
            throw new Error(
                "Supabase library could not be loaded."
            );
        }

        supabaseClient = window.supabase.createClient(
            CONFIG.SUPABASE_URL,
            CONFIG.SUPABASE_PUBLISHABLE_KEY
        );

        return supabaseClient;
    }


    /* =========================================
       ELEMENTS
    ========================================= */

    const elements = {
        icon: document.getElementById("mainIcon"),
        title: document.getElementById("pageTitle"),
        description: document.getElementById("description"),
        spinner: document.getElementById("spinner"),
        status: document.getElementById("statusMessage"),
        dashboard: document.getElementById("dashboardButton"),
        retry: document.getElementById("retryButton")
    };


    /* =========================================
       UI HELPERS
    ========================================= */

    function showLoading(message) {

        elements.spinner.classList.remove("hidden");
        elements.retry.classList.add("hidden");
        elements.dashboard.classList.add("hidden");

        elements.icon.textContent = "✦";

        elements.status.className = "status";
        elements.status.textContent = message;

    }


    function showSuccess(message, isTrial) {

        elements.spinner.classList.add("hidden");
        elements.retry.classList.add("hidden");
        elements.dashboard.classList.remove("hidden");

        elements.icon.textContent = "✓";
        elements.icon.style.color = "var(--success)";

        elements.title.textContent = isTrial
            ? "Your Premium Trial Is Active!"
            : "Premium Activated!";

        elements.description.textContent = isTrial
            ? "Your StudyMind AI Premium trial is now active."
            : "Your payment has been verified and your Premium subscription is active.";

        elements.status.className = "status success";
        elements.status.textContent = message;

    }


    function showError(message, allowRetry = false) {

        elements.spinner.classList.add("hidden");
        elements.dashboard.classList.add("hidden");

        elements.icon.textContent = "!";
        elements.icon.style.color = "var(--error)";

        elements.title.textContent = "Verification Unsuccessful";

        elements.description.textContent =
            "We could not confirm your Premium activation.";

        elements.status.className = "status error";
        elements.status.textContent = message;

        if (allowRetry) {
            elements.retry.classList.remove("hidden");
        }

    }


    /* =========================================
       AUTHENTICATION
    ========================================= */

    async function getAccessToken() {

        const client = initializeSupabase();

        const {
            data,
            error
        } = await client.auth.getSession();

        if (error) {
            throw new Error(
                "Could not retrieve your login session."
            );
        }

        const token =
            data?.session?.access_token;

        if (!token) {
            throw new Error(
                "Your login session has expired. Please sign in again."
            );
        }

        return token;
    }


    /* =========================================
       API REQUEST
    ========================================= */

    async function apiRequest(endpoint, token, body = null) {

        const options = {
            method: body ? "POST" : "GET",

            headers: {
                Authorization: `Bearer ${token}`,
                apikey: CONFIG.SUPABASE_PUBLISHABLE_KEY,
                "Content-Type": "application/json"
            },

            cache: "no-store"
        };

        if (body) {
            options.body = JSON.stringify(body);
        }

        const response = await fetch(
            endpoint,
            options
        );

        let data;

        try {
            data = await response.json();
        } catch {
            throw new Error(
                "The server returned an invalid response."
            );
        }

        if (!response.ok) {

            throw new Error(
                data?.error ||
                data?.message ||
                "The request could not be completed."
            );

        }

        return data;
    }


    /* =========================================
       EXTRACT PAYMENT DETAILS
    ========================================= */

    function getPaymentDetails() {

        const params = new URLSearchParams(
            window.location.search
        );

        const provider = (
            params.get("provider") || ""
        ).toLowerCase();

        if (provider === "paystack") {

            const reference =
                params.get("reference") ||
                params.get("trxref");

            if (!reference) {
                throw new Error(
                    "Paystack payment reference is missing."
                );
            }

            return {
                provider: "paystack",
                reference
            };
        }


        if (provider === "flutterwave") {

            const paymentStatus =
                (params.get("status") || "").toLowerCase();

            if (
                paymentStatus &&
                !["successful", "success", "completed"].includes(
                    paymentStatus
                )
            ) {
                throw new Error(
                    "Flutterwave did not report a successful payment."
                );
            }

            const transactionId =
                params.get("transaction_id");

            const txRef =
                params.get("tx_ref") ||
                params.get("reference");

            if (!transactionId || !txRef) {
                throw new Error(
                    "Flutterwave transaction details are incomplete. Please contact support if your account was charged."
                );
            }

            return {
                provider: "flutterwave",
                transaction_id: transactionId,
                tx_ref: txRef
            };
        }


        throw new Error(
            "Unknown payment provider. Please return to the Premium page."
        );
    }


    /* =========================================
       VERIFY PAYMENT
    ========================================= */

    async function verifyPayment(token, payment) {

        showLoading(
            "Verifying your payment directly with the payment provider..."
        );

        return await apiRequest(
            CONFIG.VERIFY_ENDPOINT,
            token,
            payment
        );
    }


    /* =========================================
       CHECK PREMIUM STATUS
    ========================================= */

    async function checkPremiumStatus(token) {

        return await apiRequest(
            CONFIG.STATUS_ENDPOINT,
            token
        );
    }


    /* =========================================
       MAIN VERIFICATION FLOW
    ========================================= */

    async function startVerification() {

        showLoading(
            "Preparing secure payment verification..."
        );

        try {

            const client = initializeSupabase();

            await client.auth.getSession();

            const token = await getAccessToken();

            const params = new URLSearchParams(
                window.location.search
            );

            const provider =
                (params.get("provider") || "").toLowerCase();

            let payment = null;

            /*
             * An existing active trial or Admin account
             * does not need payment verification.
             */

            if (
                provider !== "paystack" &&
                provider !== "flutterwave"
            ) {

                const existingStatus =
                    await checkPremiumStatus(token);

                if (existingStatus?.premium === true) {

                    showSuccess(
                        existingStatus.isTrial
                            ? "Your free Premium trial is active."
                            : "Your Premium access is active.",
                        existingStatus.isTrial === true
                    );

                    return;
                }

                throw new Error(
                    "Payment information is missing from this page."
                );
            }


            payment = getPaymentDetails();


            /*
             * Verify the transaction with the provider.
             */

            const verification =
                await verifyPayment(token, payment);


            if (
                verification?.success !== true &&
                verification?.verified !== true
            ) {

                throw new Error(
                    verification?.error ||
                    "The payment provider has not confirmed this transaction."
                );

            }


            /*
             * Confirm Premium status from the server.
             */

            showLoading(
                "Payment verified. Confirming your Premium subscription..."
            );

            const premiumStatus =
                await checkPremiumStatus(token);


            if (premiumStatus?.premium !== true) {

                throw new Error(
                    "Your payment was verified, but Premium activation is not yet confirmed. Please retry verification."
                );

            }


            showSuccess(
                premiumStatus.isTrial
                    ? "Your Premium trial is active."
                    : "Your payment has been verified and your subscription is active.",
                premiumStatus.isTrial === true
            );


        } catch (error) {

            console.error(
                "Premium payment verification error:",
                error
            );

            showError(
                error.message ||
                "Something went wrong during payment verification.",
                true
            );

        }

    }


    /* =========================================
       DASHBOARD NAVIGATION
    ========================================= */

    function goToDashboard() {

        window.location.href =
            CONFIG.DASHBOARD_URL;

    }


    /* =========================================
       THEME
    ========================================= */

    try {

        const savedTheme =
            localStorage.getItem("studyMindTheme");

        if (savedTheme === "dark") {
            document.body.classList.add("dark");
        }

    } catch (error) {
        console.warn("Theme preference unavailable.");
    }


    /* =========================================
       START
    ========================================= */

    document.addEventListener(
        "DOMContentLoaded",
        startVerification
    );

    </script>

</body>
</html>
