<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Welcome — StudyMind AI</title>

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>


<body>

    <main class="auth-page">

        <div class="auth-card">

            <!-- LOGO -->

            <div class="auth-logo">
                StudyMind <span>AI</span>
            </div>


            <!-- HEADER -->

            <div class="auth-header">

                <h1>
                    Welcome to StudyMind AI
                </h1>

                <p>
                    Your AI-powered study companion for
                    smarter, more organized and effective studying.
                </p>

            </div>


            <!-- AUTH BUTTONS -->

            <div class="welcome-actions">

                <a
                    href="signup.html"
                    class="auth-button"
                >
                    Sign Up
                </a>


                <a
                    href="login.html"
                    class="welcome-login-button"
                >
                    Log In
                </a>

            </div>


            <!-- DESCRIPTION -->

            <p class="welcome-note">
                Plan smarter. Study consistently. Progress with purpose.
            </p>


        </div>

    </main>

</body>

</html>
